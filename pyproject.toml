[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purr"
version = "1.6.0"
description = "Data reduction logging tool, Useful for remembering reductions"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Oleg Smirnov", email = "osmirnov@gmail.com" }]
requires-python = ">=3.10,<3.15"
# A Qt binding (PyQt5 or PyQt6) is also needed. It is not listed here because on
# KERN/Debian/Ubuntu it comes from apt (python3-pyqt5); pip users can install the
# "pyqt5" or "pyqt6" extra instead.
dependencies = [
    "astro-kittens>=1.5.0",
    "qtpy>=2.0",
    "pillow",
    "numpy",
    "scipy",
    "astropy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
pyqt5 = ["PyQt5"]
pyqt6 = ["PyQt6"]
test = ["pytest"]

[project.scripts]
purr = "Purr.purr:main"
# kept for anyone who calls the old script name
"purr.py" = "Purr.purr:main"

[project.urls]
Homepage = "https://github.com/ratt-ru/purr"
Repository = "https://github.com/ratt-ru/purr"

[tool.setuptools]
packages = [
    "Purr",
    "Purr.Plugins",
    "Purr.Plugins.local_pychart",
    "Purr.Plugins.local_pychart.afm",
]

[tool.setuptools.package-data]
Purr = ["icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# no .pytest_cache: it would end up in Debian packages built with tests enabled
addopts = "-p no:cacheprovider"
